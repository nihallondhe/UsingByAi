<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Homepage</title>
    <style>
        :root {
            --primary: #6366f1;
            --dark: #0f172a;
            --light: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            background-color: var(--light);
            color: var(--dark);
        }
        nav {
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hero {
            text-align: center;
            padding: 100px 20px;
        }
        h1 { font-size: 3.5rem; margin-bottom: 1rem; }
        .btn {
            background: var(--primary);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: bold; font-size: 1.5rem;">BRAND</div>
        <div>Features | About | Contact</div>
    </nav>

    <section class="hero">
        <h1>Building the future.</h1>
        <p>A modern boilerplate for your next big idea.</p>
        <br><br>
        <a href="#" class="btn">Get Started</a>
    </section>

    <section class="grid">
        <div class="card"><h3>Fast</h3><p>Optimized for speed and performance.</p></div>
        <div class="card"><h3>Modern</h3><p>Built with latest web standards.</p></div>
        <div class="card"><h3>Secure</h3><p>Protected by industry best practices.</p></div>
    </section>

</body>
</html>
